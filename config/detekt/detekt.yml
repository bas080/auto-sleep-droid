build:
  maxIssues: 0
  weights:
    complexity: 1

config:
  validation: true

complexity:
  active: true
  excludes: ['**/test/**']
  CognitiveComplexMethod:
    active: true
    threshold: 10
  ComplexCondition:
    active: true
    threshold: 4
  ComplexInterface:
    active: true
    threshold: 10
  CyclomaticComplexMethod:
    active: true
    threshold: 10
  LargeClass:
    active: true
    threshold: 600
    excludes: ['**/MainService.kt', '**/MainActivity.kt']
  LongMethod:
    active: true
    threshold: 50
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 6
    ignoreDataClasses: true
  NestedBlockDepth:
    active: true
    threshold: 4
  TooManyFunctions:
    active: true
    thresholdInFiles: 30
    thresholdInClasses: 25
    thresholdInObjects: 15
    excludes: ['**/MainService.kt', '**/MainActivity.kt', '**/EventLogger.kt']

empty-blocks:
  active: true
  excludes: ['**/test/**']

exceptions:
  active: true
  excludes: ['**/test/**']
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false

performance:
  active: true
  excludes: ['**/test/**']

potential-bugs:
  active: true
  excludes: ['**/test/**']

style:
  active: true
  excludes: ['**/test/**']
  MaxLineLength:
    active: false
  MagicNumber:
    active: false
  WildcardImport:
    active: false
  ReturnCount:
    active: true
    max: 3
    excludedFunctions: ['equals']
  UnusedPrivateMember:
    active: false
  UnusedPrivateProperty:
    active: false
