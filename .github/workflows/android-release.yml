name: Android APK

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.2.4 or 0.3)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trigger-release:
    name: Run release script and push tag
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Run release script and push master and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          RAW_VERSION="${{ inputs.version }}"
          VERSION_NAME="${RAW_VERSION#v}"
          ./scripts/release.sh "${VERSION_NAME}"
          git push origin master "v${VERSION_NAME}"

  build-test-release:
    name: Test, Build & Publish APK
    needs: [trigger-release]
    if: |
      always() &&
      !cancelled() &&
      (
        needs.trigger-release.result == 'success' ||
        (
          needs.trigger-release.result == 'skipped' &&
          (
            github.event_name == 'pull_request' ||
            (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
            startsWith(github.ref, 'refs/tags/v')
          )
        )
      )
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout release tag for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          RAW_VERSION="${{ inputs.version }}"
          VERSION_NAME="${RAW_VERSION#v}"
          VERSION_TAG="v${VERSION_NAME}"
          git fetch origin tag "${VERSION_TAG}" --force
          git checkout "${VERSION_TAG}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests
        run: ./gradlew test --parallel

      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || vars.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Error: KEYSTORE_BASE64 secret is not defined."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.jks
          KEYSTORE_FILE=/tmp/release.jks ./gradlew assembleRelease

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-sleep-droid-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create draft release for pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          TAG_NAME="pr-${PR_NUM}"
          cp app/build/outputs/apk/release/app-release.apk "auto-sleep-droid-${TAG_NAME}.apk"

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" --target "${GITHUB_SHA}" --title "PR #${PR_NUM}: ${BRANCH_NAME}" --draft=true
            gh release upload "${TAG_NAME}" "auto-sleep-droid-${TAG_NAME}.apk" --clobber
          else
            gh release create "${TAG_NAME}" "auto-sleep-droid-${TAG_NAME}.apk" \
              --target "${GITHUB_SHA}" \
              --title "PR #${PR_NUM}: ${BRANCH_NAME}" \
              --notes "Draft release build for PR #${PR_NUM} (${BRANCH_NAME}). Not visible to the public." \
              --draft=true
          fi

      - name: Create or update latest release (master push)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk auto-sleep-droid-latest.apk
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git tag -f latest "${GITHUB_SHA}"
          git push origin refs/tags/latest --force || true

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "${BRANCH_NAME}" --prerelease=false --draft=false
            gh release edit latest --target "${GITHUB_SHA}" --latest=true
            gh release upload latest auto-sleep-droid-latest.apk --clobber
          else
            gh release create latest auto-sleep-droid-latest.apk \
              --target "${GITHUB_SHA}" \
              --title "${BRANCH_NAME}" \
              --notes "Latest debug APK built from ${BRANCH_NAME}." \
              --draft=false \
              --latest=true
          fi

      - name: Create versioned GitHub release (tag push)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VERSION="${{ inputs.version }}"
            VERSION_TAG="v${RAW_VERSION#v}"
          else
            VERSION_TAG="${GITHUB_REF_NAME}"
          fi
          cp app/build/outputs/apk/release/app-release.apk "auto-sleep-droid-${VERSION_TAG}.apk"
          gh release create "${VERSION_TAG}" "auto-sleep-droid-${VERSION_TAG}.apk" \
            --title "Auto Sleep Droid ${VERSION_TAG}" \
            --generate-notes
