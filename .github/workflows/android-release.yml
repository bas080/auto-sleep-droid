name: Android APK

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  latest:
    name: Build latest APK
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Prepare latest APK
        run: cp app/build/outputs/apk/debug/app-debug.apk auto-sleep-droid-latest.apk

      - name: Upload latest APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-sleep-droid-latest
          path: auto-sleep-droid-latest.apk
          if-no-files-found: error

      - name: Create or update latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest "${GITHUB_SHA}"
          git push origin refs/tags/latest --force

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --prerelease=false --draft=false
            gh release edit latest --target "${GITHUB_SHA}" --latest=true
            gh release upload latest auto-sleep-droid-latest.apk --clobber
          else
            gh release create latest auto-sleep-droid-latest.apk \
              --target "${GITHUB_SHA}" \
              --title "Latest build" \
              --notes "Latest debug APK built from master." \
              --latest=true
          fi

  version:
    name: Release version tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Prepare versioned APK
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: cp app/build/outputs/apk/debug/app-debug.apk "auto-sleep-droid-${VERSION_TAG}.apk"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          gh release create "${VERSION_TAG}" "auto-sleep-droid-${VERSION_TAG}.apk" \
            --title "Auto Sleep Droid ${VERSION_TAG}" \
            --generate-notes
