name: Android APK

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests
        run: ./gradlew test --parallel

  latest:
    name: Build latest APK
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.jks
            KEYSTORE_FILE=/tmp/release.jks ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Prepare latest APK
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk auto-sleep-droid-latest.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk auto-sleep-droid-latest.apk
          fi

      - name: Upload latest APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-sleep-droid-latest
          path: auto-sleep-droid-latest.apk
          if-no-files-found: error

      - name: Create or update latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git tag -f latest "${GITHUB_SHA}"
          git push origin refs/tags/latest --force || true

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "${BRANCH_NAME}" --prerelease=false --draft=false
            gh release edit latest --target "${GITHUB_SHA}" --latest=true
            gh release upload latest auto-sleep-droid-latest.apk --clobber
          else
            gh release create latest auto-sleep-droid-latest.apk \
              --target "${GITHUB_SHA}" \
              --title "${BRANCH_NAME}" \
              --notes "Latest debug APK built from ${BRANCH_NAME}." \
              --draft=false \
              --latest=true
          fi

  version:
    name: Release version tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.jks
            KEYSTORE_FILE=/tmp/release.jks ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Prepare versioned APK
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "auto-sleep-droid-${VERSION_TAG}.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "auto-sleep-droid-${VERSION_TAG}.apk"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          gh release create "${VERSION_TAG}" "auto-sleep-droid-${VERSION_TAG}.apk" \
            --title "Auto Sleep Droid ${VERSION_TAG}" \
            --generate-notes
